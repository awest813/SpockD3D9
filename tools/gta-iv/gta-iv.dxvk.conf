# Grand Theft Auto IV (Steam, Windows) — SpockD3D9 profile
# ==========================================================
# Engine: RAGE · API: Direct3D 9 (SM3, deferred + post-processing)
#
# Why this title: GTA IV (32-bit) has already been proven to run end-to-end
# under Wine/Rosetta with a D3D9 replacement layer (the d9mt project,
# neo773/d9mt — see docs/DX9_METAL_ROADMAP.md), which makes it a
# de-risked second retail candidate alongside Fallout 3.
#
# Usage (external Windows host — see tools/gta-iv/README.md):
#   Copy next to GTAIV.exe as "dxvk.conf", or set DXVK_CONFIG_FILE.
#
# Every key below is a documented SpockD3D9 option (see ../../dxvk.conf).
# Upstream DXVK also ships a compiled-in GTAIV/EFLC profile
# (src/util/config/config.cpp) that auto-applies NVAPI-era workarounds
# (hideNvidiaGpu, 128 MB memory cap, DFF formats off); this file layers
# macOS/MoltenVK tuning on top.

# --- Shader pipeline -------------------------------------------------------

# GTA IV creates many unique shader permutations; cache aggressively.
dxvk.enableShaderCache = True

# Apple GPU tiler heuristics.
dxvk.tilerMode = Auto

# --- Presentation ----------------------------------------------------------

# The engine's frame pacer misbehaves with deep present queues.
d3d9.maxFrameLatency = 1

# --- Device loss -----------------------------------------------------------

# Alt-tabbing is a known GTA IV weak spot; upstream's compiled-in profile
# already sets d3d9.deviceLossOnFocusLoss = True for \\(GTAIV|EFLC)\.exe$,
# which matches the hosted window case. Leave it unset here so the
# compiled-in profile stays the source of truth.

# --- Optional tuning (commented) -------------------------------------------

# 60 fps cap if the physics/timing engine misbehaves unbounded (RAGE is
# frame-rate sensitive above ~60).
# d3d9.maxFrameRate = 60

# Strict float emulation if post-processing shows NaN-style artifacts.
# d3d9.floatEmulation = Strict
